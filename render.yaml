services:
  - type: web
    name: warehouse-lab2-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-lab2-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://warehouse-lab2-frontend.onrender.com,http://localhost:3000,http://localhost:5173
      - key: MANAGEMENT_HEALTH_SHOW_DETAILS
        value: always

  - type: web
    name: warehouse-lab2-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_BASE_URL
        value: https://warehouse-lab2-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: warehouse-lab2-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: warehouse_db
    user: warehouse_user
