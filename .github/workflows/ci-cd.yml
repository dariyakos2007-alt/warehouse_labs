name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: warehouse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d warehouse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run backend tests
        run: ./mvnw -B test
        env:
          DB_NAME: warehouse_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/warehouse_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -f Dockerfile -t warehouse-lab2-backend:${{ github.sha }} .

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t warehouse-lab2-frontend:${{ github.sha }} ./frontend

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs:
      - docker-build
    if: github.event_name != 'pull_request'
    environment: production
    outputs:
      hooks_configured: ${{ steps.deploy-config.outputs.hooks_configured }}
    env:
      RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
      RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
    steps:
      - name: Check deploy hook configuration
        id: deploy-config
        run: |
          if [ -n "$RENDER_BACKEND_DEPLOY_HOOK_URL" ] && [ -n "$RENDER_FRONTEND_DEPLOY_HOOK_URL" ]; then
            echo "hooks_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "hooks_configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy backend
        if: env.RENDER_BACKEND_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_BACKEND_DEPLOY_HOOK_URL"

      - name: Deploy frontend
        if: env.RENDER_FRONTEND_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_FRONTEND_DEPLOY_HOOK_URL"

      - name: Print deploy hook hint
        if: env.RENDER_BACKEND_DEPLOY_HOOK_URL == '' || env.RENDER_FRONTEND_DEPLOY_HOOK_URL == ''
        run: |
          echo "Add RENDER_BACKEND_DEPLOY_HOOK_URL and RENDER_FRONTEND_DEPLOY_HOOK_URL repository secrets to enable Render deploys."

  healthcheck:
    name: Production healthcheck
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'pull_request' && needs.deploy.outputs.hooks_configured == 'true'
    env:
      RENDER_BACKEND_HEALTH_URL: ${{ secrets.RENDER_BACKEND_HEALTH_URL }}
      RENDER_FRONTEND_HEALTH_URL: ${{ secrets.RENDER_FRONTEND_HEALTH_URL }}
    steps:
      - name: Wait for deployment startup
        run: sleep 60

      - name: Check backend actuator health
        run: |
          BACKEND_URL="${RENDER_BACKEND_HEALTH_URL:-https://warehouse-lab2-backend.onrender.com/actuator/health}"
          curl -fsS --retry 30 --retry-delay 10 --retry-all-errors --max-time 10 "$BACKEND_URL"

      - name: Check frontend
        run: |
          FRONTEND_URL="${RENDER_FRONTEND_HEALTH_URL:-https://warehouse-lab2-frontend.onrender.com/}"
          curl -fsS --retry 30 --retry-delay 10 --retry-all-errors --max-time 10 "$FRONTEND_URL"
